<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tap Rush</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="game-container">

        <div class="game-card">

            <h1>Tap Rush</h1>

            <p class="instructions">
                Tap as fast as you can!
            </p>

            <!-- GAME INFORMATION -->

            <div class="game-info">

                <div>
                    <span>Time</span>
                    <strong id="time">10</strong>
                </div>

                <div>
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span>Best</span>
                    <strong id="best">0</strong>
                </div>

            </div>


            <!-- TAP BUTTON -->

            <button
                id="tapButton"
                class="tap-button"
            >
                TAP!
            </button>


            <!-- START / PLAY AGAIN -->

            <button
                id="startButton"
                class="start-button"
            >
                Start Game
            </button>


            <!-- GAME MESSAGE -->

            <p id="message"></p>


            <!-- SHARE BUTTON -->

            <button
                id="shareButton"
                class="share-button"
                style="display: none;"
            >
                📤 Share My Score
            </button>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="game.js"></script>

</body>

</html>
